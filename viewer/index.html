<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Апартамент 75 – 3D</title>

</style>

{ "imports": {

</head>

  <button data-view="kitchen">Кухня</button>
  <button data-view="dining">Трапезария</button>

  <button data-view="bedroom">Спалня</button>

  <button id="measure">📏 Измерване</button>

function toggle(p, open) { invalidate(); p.userData.dir = (open === undefined ? (p.userData.dir > 0 || p.userData.t > 0.5 ? -1 : 1) : (open ? 1 : -1)); }
document.getElementById("openall").onclick = () => pivots.forEach(p => toggle(p, true));
document.getElementById("closeall").onclick = () => pivots.forEach(p => toggle(p, false));
document.querySelectorAll("[data-view]").forEach(b => b.onclick = () => go(b.dataset.view));
document.querySelectorAll("[data-walls]").forEach(b => b.onclick = () => setWalls(b.dataset.walls));
document.getElementById("fov").oninput = (e) => setFov(+e.target.value);
document.getElementById("ceil").onclick = (e) => { const v = !ceilings[0]?.visible; ceilings.forEach(c => c.visible = v); e.target.classList.toggle("on", v); renderer.shadowMap.needsUpdate = true; invalidate(); };

// tap / click (ignore drags)
let down = null, measuring = false, mPts = [], mLine = null, mLabel = null;
document.getElementById("measure").onclick = (e) => { measuring = !measuring; e.target.classList.toggle("on", measuring); mPts = []; if (mLine) { scene.remove(mLine); mLine = null; invalidate(); } info(measuring ? "Измерване: докоснете две точки." : "Докоснете врата или чекмедже, за да се отвори/затвори."); };
// merged static meshes carry parts = [[name, firstTriangle], ...] (see optimize_glb.mjs)
function partName(h) { const P = h.object.userData.parts; if (!P || h.faceIndex == null) return h.object.name; let lo = 0, hi = P.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (P[mid][1] <= h.faceIndex) lo = mid; else hi = mid - 1; } return P[lo][0]; }
function info(t) { document.getElementById("info").innerHTML = t; }
canvas.addEventListener("pointerdown", (e) => { down = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", (e) => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6 || !model) return;
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObject(model, true).filter(h => h.object.visible);
  if (!hits.length) return;
  if (measuring) {
    mPts.push(hits[0].point.clone());
    if (mPts.length === 2) {
      if (mLine) scene.remove(mLine);
      mLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(mPts), new THREE.LineBasicMaterial({ color: 0xd04020, depthTest: false }));
      mLine.renderOrder = 9; scene.add(mLine); invalidate();
      const d = mPts[0].distanceTo(mPts[1]); const dx = Math.abs(mPts[0].x - mPts[1].x), dy = Math.abs(mPts[0].z - mPts[1].z), dz = Math.abs(mPts[0].y - mPts[1].y);
      info(`<b>${(d * 100).toFixed(1)} см</b> &nbsp; (по X ${(dx*100).toFixed(1)} · по Y ${(dy*100).toFixed(1)} · височина ${(dz*100).toFixed(1)} см)`); mPts = [];
    } else info("Измерване: втора точка…");
    return;
  }
  let o = hits[0].object;
  while (o && !o.userData.cab_kind) o = o.parent;
  if (o) { toggle(o); info(`<b>${o.userData.cab_label || o.name.replace("CAB_", "")}</b>`); }
  else { info(`<b>${partName(hits[0])}</b>`); }
});

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; setFov(hfov); invalidate(); }
addEventListener("resize", resize); resize();
// Mirrors: none in the overview (the mirror bodies keep their metallic look). In a room the LIVE nearest mirrors that
// are in view and within NEAR m re-render every frame; the others refresh once the view has been still for SETTLE ms.
const NEAR = 4.5, LIVE = 2, SETTLE = 200, _rp = new THREE.Vector3(), _fr = new THREE.Frustum(), _pm = new THREE.Matrix4(), _n = new THREE.Vector3(), _v = new THREE.Vector3();
let dirty = true, movingFrames = 0;
function draw(settled, pr = FULL_PR) {
  if (renderer.getPixelRatio() !== pr) renderer.setPixelRatio(pr);
  camera.updateMatrixWorld(); _fr.setFromProjectionMatrix(_pm.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse));
  const cand = [];
  for (const r of reflectors) { r.visible = lookMode; r.userData.allow = lookMode && settled;
    if (lookMode && !settled) { r.updateWorldMatrix(true, false); const d = r.getWorldPosition(_rp).distanceTo(camera.position); const facing = _v.subVectors(_rp, camera.position).dot(_n.set(0, 0, 1).transformDirection(r.matrixWorld)) < 0;
      if (d < NEAR && facing && _fr.intersectsObject(r)) cand.push([d, r]); } }
  cand.sort((a, b) => a[0] - b[0]).slice(0, LIVE).forEach(([, r]) => r.userData.allow = true);
  for (const r of reflectors) if (!r.userData.rendered && !r.userData.allow) r.visible = false;   // never show an empty (black) reflection
  renderer.render(scene, camera); dirty = !settled || pr !== FULL_PR;
}
let last = performance.now();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  let moving = false;
  for (const p of pivots) { const u = p.userData; if (u.dir) { u.t = Math.min(1, Math.max(0, u.t + u.dir * dt / 0.35)); applyPivot(p); if (u.t === 0 || u.t === 1) u.dir = 0; moving = true; } }
  if (moving) { renderer.shadowMap.needsUpdate = true; invalidate(); }
  if (!lookMode) controls.update();            // fires "change" (-> invalidate) while orbiting / damping
  if (needs > 0) { needs--; movingFrames++; draw(false, movingFrames > 3 ? MOVE_PR : FULL_PR); }
  else if (dirty && now - lastActive > SETTLE) { movingFrames = 0; draw(true); }
});
</script>
